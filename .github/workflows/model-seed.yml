name: KIRA Seed
on:
  pull_request:
    paths:
      - 'research/kira_model/**'
      - '.github/workflows/model-seed.yml'
  push:
    branches: [main]
    paths:
      - 'research/kira_model/**'
      - '.github/workflows/model-seed.yml'
jobs:
  cpu-foundation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.15'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r research/kira_model/requirements.txt
      - run: >-
          python -m pip install --no-deps --only-binary=:all:
          -r research/kira_model/requirements-bpe.txt
      - name: Tests du modèle sans Hub ni PyYAML
        run: >-
          python -c "import sys, unittest;
          sys.modules.update(huggingface_hub=None, yaml=None);
          suite = unittest.defaultTestLoader.discover('research/kira_model/tests');
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(not result.wasSuccessful())"

  bpe-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r research/kira_model/requirements.txt
      - run: >-
          python -m pip install --no-deps --only-binary=:all:
          -r research/kira_model/requirements-bpe.txt
      - name: Corpus français vérifié
        run: python -m research.kira_model.prepare_fr --output "$RUNNER_TEMP/kira-bpe-corpus"
      - name: Pilote CPU de 1000 étapes
        run: python -m research.kira_model.bpe_experiment train --corpus "$RUNNER_TEMP/kira-bpe-corpus/corpus.jsonl" --output "$RUNNER_TEMP/kira-bpe-run" --steps 1000
      - name: Générations observées
        run: |
          python -m research.kira_model.bpe_experiment generate --checkpoint "$RUNNER_TEMP/kira-bpe-run/weights.pt" --prompt "Une chercheuse" --temperature 0.5 --max-new-tokens 100
          python -m research.kira_model.bpe_experiment generate --checkpoint "$RUNNER_TEMP/kira-bpe-run/weights.pt" --prompt "Il regarda" --temperature 0.5 --max-new-tokens 100
      - name: Prolongation mesurée à 4000 étapes
        run: |
          cp "$RUNNER_TEMP/kira-bpe-run/manifest.json" "$RUNNER_TEMP/kira-bpe-run/manifest-1000.json"
          python -m research.kira_model.bpe_experiment train --corpus "$RUNNER_TEMP/kira-bpe-corpus/corpus.jsonl" --output "$RUNNER_TEMP/kira-bpe-run" --steps 4000 --resume
          python -m research.kira_model.bpe_experiment generate --checkpoint "$RUNNER_TEMP/kira-bpe-run/weights.pt" --prompt "Une chercheuse" --temperature 0.5 --max-new-tokens 100
          python -m research.kira_model.bpe_experiment generate --checkpoint "$RUNNER_TEMP/kira-bpe-run/weights.pt" --prompt "Il regarda" --temperature 0.5 --max-new-tokens 100
      - name: Manifeste observé
        run: cat "$RUNNER_TEMP/kira-bpe-run/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kira-seed-bpe-pilot
          path: |
            ${{ runner.temp }}/kira-bpe-run/manifest*.json
            ${{ runner.temp }}/kira-bpe-run/tokenizer.json
            ${{ runner.temp }}/kira-bpe-run/weights.pt
          retention-days: 14
