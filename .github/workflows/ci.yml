name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Suite de tests
        run: python -m unittest discover -s tests -t . -v

  memory-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kira_test
          POSTGRES_PASSWORD: kira_test
          POSTGRES_DB: kira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira_test -d kira_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mémoire, sessions et migrations sur PostgreSQL réel
        env:
          KIRA_TEST_POSTGRES_URL: postgresql://kira_test:kira_test@localhost:5432/kira_test
        run: python -m unittest tests.test_memory_postgres tests.test_auth_postgres -v

  web-sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --prefix "$RUNNER_TEMP/kira-ui-tests" jsdom@30.1.2
      - name: Sessions et confirmation dans l'interface
        run: NODE_PATH="$RUNNER_TEMP/kira-ui-tests/node_modules" node tests/test_web_sessions.cjs
